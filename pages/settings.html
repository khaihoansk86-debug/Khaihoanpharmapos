<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khải Hoàn POS - Cài đặt</title>
    <meta name="description" content="Thiết lập chi nhánh, phân quyền và tài khoản đăng nhập">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Roboto', 'sans-serif'] } } }
        }
    </script>

    <style>
        body { font-family: 'Roboto', sans-serif; letter-spacing: 0; }
        .input {
            width: 100%;
            border-radius: 0.75rem;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            padding: 0.65rem 0.8rem;
            font-size: 0.875rem;
            outline: none;
        }
        .dark .input {
            border-color: #334155;
            background: #0f172a;
            color: #e2e8f0;
        }
        .input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }
        .tab-button[aria-selected="true"] {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-950 text-gray-800 dark:text-slate-200 min-h-screen transition-colors duration-300">
    <!-- Header sẽ được inject bởi layout.js -->
    <div id="app-header"></div>

    <main class="w-full px-4 md:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-6 items-start">
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 shrink-0 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-300 dark:border-slate-800 p-4 sticky top-20">
            <h2 class="text-lg font-black mb-4 px-2 text-slate-800 dark:text-white">Cài đặt hệ thống</h2>
            <nav class="flex flex-col gap-1">
                <button class="tab-button w-full text-left px-4 py-3 rounded-xl text-sm font-bold border border-transparent hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors flex items-center gap-3" data-view="branch" aria-selected="true">
                    <i class="fa-solid fa-store w-5 text-center"></i>
                    Thông tin chi nhánh
                </button>
                <button class="tab-button w-full text-left px-4 py-3 rounded-xl text-sm font-bold border border-transparent hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors flex items-center gap-3 text-slate-600 dark:text-slate-400" data-view="auth" aria-selected="false">
                    <i class="fa-solid fa-user-shield w-5 text-center"></i>
                    Phân quyền & Đăng nhập
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 w-full flex flex-col gap-6">
            
            <!-- VIEW: Branch Settings -->
            <section id="branchView" class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-300 dark:border-slate-800 p-6 animate-in fade-in slide-in-from-bottom-2">
                <h3 class="font-black text-xl text-slate-800 dark:text-white mb-6 border-l-4 border-blue-600 pl-3">Thông tin chi nhánh</h3>
                
                <form id="branchForm" class="flex flex-col gap-5 max-w-2xl">
                    <input type="hidden" id="branchId">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Tên nhà thuốc / Chi nhánh</label>
                        <input id="branchName" class="input" required placeholder="VD: Nhà thuốc Khải Hoàn">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Số điện thoại</label>
                            <input id="branchPhone" class="input" placeholder="Số điện thoại liên hệ">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Địa chỉ</label>
                            <input id="branchAddress" class="input" placeholder="Địa chỉ in trên hóa đơn">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-200 dark:border-slate-800">
                        <h4 class="text-sm font-bold text-slate-700 dark:text-slate-300 mb-4"><i class="fa-solid fa-receipt mr-2"></i>Tùy chỉnh hóa đơn in</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Thông điệp đầu hóa đơn</label>
                                <textarea id="receiptHeader" class="input min-h-[80px]" placeholder="VD: Xin chào quý khách..."></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Thông điệp cuối hóa đơn</label>
                                <textarea id="receiptFooter" class="input min-h-[80px]" placeholder="VD: Cảm ơn và hẹn gặp lại!"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="mt-2 flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl px-6 py-2.5 font-black flex items-center justify-center gap-2 shadow-lg shadow-blue-500/30 transition-all">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </section>

            <!-- VIEW: Auth & Roles -->
            <section id="authView" class="hidden bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-300 dark:border-slate-800 p-6 animate-in fade-in slide-in-from-bottom-2">
                <div class="flex items-center justify-between mb-6 border-b border-slate-200 dark:border-slate-800 pb-4">
                    <div>
                        <h3 class="font-black text-xl text-slate-800 dark:text-white border-l-4 border-emerald-600 pl-3">Tài khoản & Phân quyền</h3>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 pl-4">Quản lý tài khoản đăng nhập của nhân viên vào hệ thống POS.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                    <!-- Form cấp tài khoản -->
                    <form id="userAuthForm" class="flex flex-col gap-4">
                        <h4 class="text-sm font-black uppercase text-slate-600 dark:text-slate-300">Cấp tài khoản</h4>
                        <input type="hidden" id="authEmployeeId">
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Chọn nhân viên</label>
                            <select id="authEmployeeSelect" class="input" required>
                                <option value="">-- Chọn nhân viên --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Tên đăng nhập (Username)</label>
                            <input id="authUsername" class="input" required autocomplete="off" placeholder="Ví dụ: nhanvien1">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Mật khẩu mới</label>
                            <input id="authPassword" type="password" class="input" autocomplete="new-password" placeholder="Bỏ trống nếu không muốn đổi">
                            <p class="text-[10px] text-slate-400 mt-1">Mật khẩu sẽ được mã hóa an toàn.</p>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Quyền hạn</label>
                            <select id="authRole" class="input" required>
                                <option value="staff">Nhân viên (Chỉ xem POS)</option>
                                <option value="admin">Quản lý (Toàn quyền)</option>
                            </select>
                        </div>

                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-4 py-2.5 font-black flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/30 transition-all mt-2">
                            <i class="fa-solid fa-key"></i> Lưu tài khoản
                        </button>
                    </form>

                    <!-- Danh sách tài khoản -->
                    <div class="xl:col-span-2 border-t xl:border-t-0 xl:border-l border-slate-200 dark:border-slate-800 xl:pl-8 pt-6 xl:pt-0">
                        <h4 class="text-sm font-black uppercase text-slate-600 dark:text-slate-300 mb-4">Danh sách có tài khoản</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left whitespace-nowrap">
                                <thead class="bg-slate-50 dark:bg-slate-800/50 text-[10px] uppercase font-black text-slate-500">
                                    <tr>
                                        <th class="px-4 py-2 rounded-l-lg">Nhân viên</th>
                                        <th class="px-4 py-2">Tên đăng nhập</th>
                                        <th class="px-4 py-2">Quyền</th>
                                        <th class="px-4 py-2 rounded-r-lg text-right">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="authTableBody" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                                    <!-- Render từ JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Global Module Load -->
    <script type="module">
        import { initLayout } from '../js/components/layout.js';
        initLayout('admin', 'settings');
    </script>
    <script type="module" src="../js/features/settings/settingsController.js"></script>
</body>
</html>
