<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khải Hoàn POS - Quản lý Tồn kho</title>
    <meta name="description" content="Cảnh báo tồn kho: hàng hết, hàng sắp hết, lô hết hạn, lô sắp hết hạn - Nhà thuốc Khải Hoàn">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>

    <style>
        /* Skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 8px;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-gray-800 dark:text-slate-200 min-h-screen transition-colors duration-300">

    <!-- Header injected by JS -->
    <div id="app-header"></div>

    <main class="max-w-[1920px] mx-auto px-4 md:px-6 py-8 flex flex-col gap-6">

        <!-- ── Tiêu đề ──────────────────────────────────────────────────────── -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm p-5 border border-slate-200 dark:border-slate-800 flex items-center justify-between gap-4 flex-wrap">
            <div>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white border-l-4 border-blue-600 pl-3 flex items-center gap-3">
                    <i class="fa-solid fa-warehouse text-blue-600"></i>
                    Cảnh báo Tồn kho
                </h2>
                <p class="text-sm text-slate-400 mt-1 pl-4">Theo dõi hàng hết hạn, sắp hết hạn và tình trạng tồn kho</p>
            </div>
            <button id="refreshBtn" data-action="refresh-alerts"
                class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm shadow-blue-500/20"
                aria-label="Tải lại cảnh báo">
                <i class="fa-solid fa-rotate"></i>
                <span>Tải lại</span>
            </button>
        </div>

        <!-- ── Cấu hình ngưỡng ─────────────────────────────────────────────── -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-5">
            <h3 class="font-black text-sm text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-500"></i> Ngưỡng cảnh báo
            </h3>
            <div class="flex flex-wrap items-end gap-6">
                <div>
                    <label for="settingExpiryDays" class="block text-xs font-bold text-slate-500 uppercase mb-2">
                        Cảnh báo hết hạn (ngày trước)
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="settingExpiryDays"
                            value="90" min="1" max="365"
                            class="w-24 px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none text-center">
                        <span class="text-sm text-slate-400">ngày</span>
                    </div>
                </div>
                <div>
                    <label for="settingLowStock" class="block text-xs font-bold text-slate-500 uppercase mb-2">
                        Ngưỡng "Sắp hết" (số lượng)
                    </label>
                    <div class="flex items-center gap-2">
                        <input type="number" id="settingLowStock"
                            value="10" min="1" max="9999"
                            class="w-24 px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none text-center">
                        <span class="text-sm text-slate-400">đơn vị</span>
                    </div>
                </div>
                <button data-action="apply-settings"
                    class="bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 dark:hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Áp dụng
                </button>
            </div>
        </div>

        <!-- ── Loading skeleton ────────────────────────────────────────────── -->
        <div id="pageLoading" class="flex flex-col gap-6">
            <!-- Stat cards skeleton -->
            <div class="flex flex-wrap gap-4">
                <div class="flex-1 min-w-[180px] h-28 skeleton"></div>
                <div class="flex-1 min-w-[180px] h-28 skeleton"></div>
                <div class="flex-1 min-w-[180px] h-28 skeleton"></div>
                <div class="flex-1 min-w-[180px] h-28 skeleton"></div>
            </div>
            <!-- Section skeletons -->
            <div class="h-48 skeleton rounded-2xl"></div>
            <div class="h-48 skeleton rounded-2xl"></div>
            <div class="h-48 skeleton rounded-2xl"></div>
            <div class="h-48 skeleton rounded-2xl"></div>
        </div>

        <!-- ── Nội dung thực ───────────────────────────────────────────────── -->
        <div id="pageContent" class="hidden flex flex-col gap-6">

            <!-- Error banner -->
            <div id="globalError" class="hidden"></div>

            <!-- Stat cards (rendered by JS) -->
            <div id="statCardsRow" class="flex flex-wrap gap-4"></div>

            <!-- 4 alert sections (rendered by JS) -->
            <div id="sectionExpired"></div>
            <div id="sectionNearExpiry"></div>
            <div id="sectionOutOfStock"></div>
            <div id="sectionLowStock"></div>

        </div>
    </main>

    <script type="module" src="../js/features/inventory/inventoryController.js"></script>
</body>
</html>
