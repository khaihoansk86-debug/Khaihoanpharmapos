<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khải Hoàn POS - Tồn kho</title>
    <meta name="description" content="Quản lý tồn kho, lô hàng và hạn sử dụng - Nhà thuốc Khải Hoàn">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-gray-800 dark:text-slate-200 min-h-screen transition-colors duration-300">

    <!-- App Header (injected by JS) -->
    <div id="app-header"></div>

    <main class="w-full px-4 md:px-6 lg:px-8 py-8 flex flex-col gap-6">

        <!-- Title Box -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm p-5 border border-slate-300 dark:border-slate-800 flex items-center justify-between">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white border-l-4 border-blue-600 pl-3 flex items-center gap-3">
                <i class="fa-solid fa-warehouse text-blue-600"></i>
                Quản lý Tồn kho
            </h2>
            <span class="text-sm text-slate-400 dark:text-slate-500 font-medium">Sắp ra mắt</span>
        </div>

        <!-- Coming Soon Placeholder -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-300 dark:border-slate-800 flex flex-col items-center justify-center py-28 gap-5 text-center">
            <div class="w-20 h-20 rounded-2xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center">
                <i class="fa-solid fa-warehouse text-4xl text-blue-400"></i>
            </div>
            <div>
                <h3 class="text-xl font-black text-slate-700 dark:text-slate-200 mb-2">Tính năng đang xây dựng</h3>
                <p class="text-slate-400 dark:text-slate-500 text-sm max-w-md leading-relaxed">
                    Màn hình Tồn kho sẽ cho phép theo dõi số lượng tồn theo lô, cảnh báo hết hạn,
                    và kiểm kê định kỳ. Tính năng sẽ ra mắt trong phiên bản tiếp theo.
                </p>
            </div>
            <a href="products.html"
               class="mt-2 flex items-center gap-2 text-sm font-bold text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 transition-colors">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                Quay về Hàng hóa
            </a>
        </div>

    </main>

    <!-- Javascript Logic -->
    <script type="module" src="../js/features/inventory/inventoryController.js"></script>
</body>
</html>
