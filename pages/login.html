<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Khải Hoàn POS</title>
    <meta name="description" content="Đăng nhập hệ thống POS Khải Hoàn">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 h-screen flex items-center justify-center transition-colors duration-300 relative overflow-hidden">
    
    <!-- Background Decoration -->
    <div class="absolute inset-0 z-0 opacity-30 dark:opacity-20 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-blue-500 blur-[120px]"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-emerald-500 blur-[120px]"></div>
    </div>

    <!-- Login Box -->
    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl w-full max-w-md rounded-[2rem] shadow-2xl border border-white/50 dark:border-slate-800 p-8 z-10 animate-in fade-in zoom-in duration-500">
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-blue-700 text-white rounded-2xl mx-auto flex items-center justify-center text-4xl mb-6 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-house-medical"></i>
            </div>
            <h1 class="text-3xl font-black uppercase text-slate-800 dark:text-white tracking-tight">Khải Hoàn <span class="text-blue-600 dark:text-blue-400">POS</span></h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-bold mt-2 uppercase tracking-widest">Đăng nhập hệ thống</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div id="errorMsg" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 px-4 py-3 rounded-xl text-sm font-bold border border-red-100 dark:border-red-900/50 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="errorText"></span>
            </div>

            <div>
                <label class="block text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 ml-1">Tên đăng nhập</label>
                <div class="relative group">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                    <input type="text" id="username" required 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-bold transition-all shadow-inner" 
                           placeholder="Nhập tên đăng nhập...">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-2 ml-1">Mật khẩu</label>
                <div class="relative group">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                    <input type="password" id="password" required 
                           class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-bold transition-all shadow-inner" 
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-4 font-black uppercase tracking-widest text-sm shadow-xl shadow-blue-500/30 transition-all flex justify-center items-center gap-2 mt-2 group relative overflow-hidden">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                <span class="relative z-10">Đăng nhập</span>
                <i class="fa-solid fa-arrow-right relative z-10 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

    </div>
    
    <script>
        // Init dark mode immediately to avoid flash
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script type="module" src="../js/features/auth/loginController.js"></script>
</body>
</html>
