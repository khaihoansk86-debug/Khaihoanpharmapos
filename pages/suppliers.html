<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khải Hoàn POS - Quản lý Đối tác</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        .app-surface { background: #f8fafc; }
        .dark .app-surface { background: #020617; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .dark .glass-card { background: #0f172a; border-color: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="app-surface text-slate-800 dark:text-slate-200 min-h-screen flex flex-col transition-colors duration-300">
    <div id="app-header"></div>

    <main class="flex-1 container mx-auto p-4 md:p-6 space-y-6">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">Quản lý Đối tác & Nguồn hàng</h1>
                <p class="text-sm text-slate-500 font-medium">Lưu trữ thông tin nhà cung cấp, trình dược viên và website đặt hàng.</p>
            </div>
            <button onclick="window.openAddSupplierModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-2xl font-bold shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2 shrink-0">
                <i class="fa-solid fa-plus"></i> Thêm đối tác mới
            </button>
        </div>

        <!-- Filter & Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-3 glass-card p-4 rounded-3xl flex items-center gap-4">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="supplierSearch" placeholder="Tìm tên, mã hoặc thông tin liên hệ..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all">
                </div>
                <select id="contactTypeFilter" class="bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-sm px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500/20">
                    <option value="all">Tất cả hình thức</option>
                    <option value="phone">Trình dược (SĐT/Zalo)</option>
                    <option value="web">Website đặt hàng</option>
                    <option value="internal">Nội bộ / Khác</option>
                </select>
            </div>
            <div class="glass-card p-4 rounded-3xl flex items-center justify-between">
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tổng đối tác</p>
                    <p id="totalSuppliers" class="text-2xl font-black text-blue-600">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-50 dark:bg-blue-900/20 rounded-2xl flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-handshake text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Supplier Grid -->
        <div id="supplierGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center">
                <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                <p class="font-bold text-slate-400">Đang tải danh sách đối tác...</p>
            </div>
        </div>
    </main>

    <!-- Modal Thêm/Sửa Đối tác -->
    <div id="supplierModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-2xl w-full max-w-lg overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800 animate-in zoom-in-95 duration-200">
            <div class="p-8 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-900/50">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl">
                        <i class="fa-solid fa-address-card"></i>
                    </div>
                    <div>
                        <h3 id="modalTitle" class="text-xl font-black text-slate-800 dark:text-white uppercase tracking-tight">Thêm đối tác</h3>
                        <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Thông tin liên hệ đặt hàng</p>
                    </div>
                </div>
                <button onclick="window.closeSupplierModal()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 text-slate-400 hover:text-red-500 transition-all flex items-center justify-center shadow-sm border border-slate-100 dark:border-slate-700">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="supplierForm" class="p-8 space-y-5 custom-scrollbar overflow-y-auto max-h-[70vh]">
                <input type="hidden" id="supplier_id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Tên đối tác / Nhà cung cấp <span class="text-red-500">*</span></label>
                        <input type="text" id="name" required placeholder="Ví dụ: Công ty Dược Hậu Giang, Trình dược Nam..." class="w-full px-5 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all font-bold">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Hình thức liên hệ</label>
                        <select id="contact_type" class="w-full px-5 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all font-bold appearance-none cursor-pointer">
                            <option value="phone">SĐT / Zalo</option>
                            <option value="web">Website / Link</option>
                            <option value="internal">Nội bộ / Khác</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Mã đối tác</label>
                        <input type="text" id="supplier_code" placeholder="(Tự động tạo)" class="w-full px-5 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all font-bold uppercase">
                    </div>
                </div>

                <div id="contactInfoSection">
                    <label id="contactInfoLabel" class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Số điện thoại / Link liên hệ</label>
                    <div class="relative">
                        <i id="contactInfoIcon" class="fa-solid fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="contact_info" placeholder="Nhập SĐT hoặc URL..." class="w-full pl-12 pr-5 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Địa chỉ / Ghi chú</label>
                    <textarea id="note" rows="3" placeholder="Ghi chú thêm về cách thức đặt hàng..." class="w-full px-5 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-sm focus:ring-2 focus:ring-blue-500/20 outline-none transition-all"></textarea>
                </div>

                <div class="flex items-center gap-3 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl">
                    <input type="checkbox" id="is_active" checked class="w-5 h-5 rounded-lg border-none text-blue-600 focus:ring-0">
                    <label for="is_active" class="text-sm font-bold text-slate-600 dark:text-slate-400">Đang hợp tác / Hoạt động</label>
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="button" onclick="window.closeSupplierModal()" class="flex-1 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">Hủy</button>
                    <button type="submit" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black shadow-xl shadow-blue-500/30 transition-all flex items-center justify-center gap-2 uppercase tracking-wider">
                        <i class="fa-solid fa-check"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../js/features/suppliers/supplierController.js"></script>
</body>
</html>
