    <!-- Javascript Logic -->
    <script>
        // CẤU HÌNH SUPABASE Ở ĐÂY
        const SUPABASE_URL = 'https://iejgtdcdzababydaqjef.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_AjGRJy05OUTeqEJxvhy8eg_Rck3CpU1';

        let supabaseClient = null;

        document.addEventListener('DOMContentLoaded', () => {
            initDarkMode();
            initSupabase();
            setupSearch();
        });

        function initDarkMode() {
            // Kiểm tra trạng thái lưu trong localStorage hoặc system preference
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').classList.replace('fa-sun', 'fa-moon');
            }
        }

        function toggleFilter() {
            const panel = document.getElementById('inlineFilterPanel');
            panel.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            const htmlEl = document.documentElement;
            const iconEl = document.getElementById('theme-icon');

            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.theme = 'light';
                iconEl.classList.replace('fa-sun', 'fa-moon');
            } else {
                htmlEl.classList.add('dark');
                localStorage.theme = 'dark';
                iconEl.classList.replace('fa-moon', 'fa-sun');
            }
        }

        function initSupabase() {
            const loadingEl = document.getElementById('loading');

            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                loadingEl.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-6 rounded-lg max-w-lg text-center shadow-sm border border-red-100">
                        <i class="fa-solid fa-circle-exclamation text-4xl mb-3"></i>
                        <h3 class="font-bold text-lg mb-2">Chưa cấu hình Supabase</h3>
                        <p class="text-sm">Vui lòng điền <strong>SUPABASE_URL</strong> và <strong>SUPABASE_ANON_KEY</strong> vào mã nguồn HTML để tiếp tục.</p>
                    </div>`;
                return;
            }

            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                fetchProducts();
            } catch (error) {
                console.error("Lỗi khởi tạo Supabase:", error);
                loadingEl.innerHTML = `<div class="text-red-500 font-bold">Lỗi khởi tạo Supabase: ${error.message}</div>`;
            }
        }

        // Biến toàn cục lưu danh sách sản phẩm để filter
        let allProducts = [];

        async function fetchProducts() {
            const loadingEl = document.getElementById('loading');
            
            try {
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('*, product_units(*)');

                if (error) throw error;
                
                allProducts = products || [];
                renderProducts(allProducts);
            } catch (error) {
                console.error('Lỗi khi tải dữ liệu:', error);
                loadingEl.innerHTML = `
                    <div class="text-center text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-bold">Lỗi khi truy vấn Supabase:</p>
                        <p class="text-sm mt-1">${error.message}</p>
                    </div>`;
            }
        }

        function renderProducts(products) {
            const loadingEl = document.getElementById('loading');
            const wrapperEl = document.getElementById('product-table-wrapper');
            const containerEl = document.getElementById('product-container');

            loadingEl.classList.add('hidden');
            wrapperEl.classList.remove('hidden');

            if (!products || products.length === 0) {
                containerEl.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-16 text-center">
                            <div class="flex flex-col items-center justify-center">
                                <i class="fa-solid fa-box-open text-4xl text-gray-300 mb-3"></i>
                                <p class="text-gray-500 font-medium">Chưa có sản phẩm nào trong kho.</p>
                            </div>
                        </td>
                    </tr>`;
                return;
            }

            containerEl.innerHTML = products.map(product => {
                // Liệt kê các Đơn vị tính và Giá bán thành 1 chuỗi hoặc các thẻ nhỏ
                const units = product.product_units || [];
                let pricesHtml = '';

                if (units.length > 0) {
                    pricesHtml = units.map(unit => `
                        <div class="text-sm mb-1 last:mb-0">
                            <span class="text-slate-500 dark:text-slate-400">${unit.unit_name || unit.name || 'ĐVT'}:</span>
                            <span class="font-bold text-blue-600 dark:text-blue-400 ml-1">${formatCurrency(unit.retail_price)}</span>
                        </div>
                    `).join('');
                } else {
                    pricesHtml = `<span class="text-slate-400 dark:text-slate-500 italic text-sm">Chưa thiết lập giá</span>`;
                }

                // Mock Expiration Date vì DB hiện tại chưa có
                const expDate = product.expiration_date || '--/--/----';

                return `
                    <tr class="product-row hover:bg-slate-50/80 dark:hover:bg-slate-800/50 transition-colors group"
                        data-name="${(product.name || '').toLowerCase()}"
                        data-code="${(product.product_code || '').toLowerCase()}">
                        
                        <td class="py-4 px-3 text-center border border-gray-300 dark:border-slate-700">
                            <input type="checkbox" class="row-checkbox rounded text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer" value="${product.product_code}" onchange="updateBulkEditButton()">
                        </td>
                        
                        <td class="py-4 px-5 border border-gray-300 dark:border-slate-700">
                            <span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wider font-mono">
                                ${product.product_code || '---'}
                            </span>
                        </td>
                        
                        <td class="py-4 px-5 border border-gray-300 dark:border-slate-700">
                            <div class="font-bold text-slate-800 dark:text-white text-base mb-1">${product.name || 'Tên thuốc'}</div>
                            <div class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-[250px]" title="${product.active_ingredient || ''}">
                                ${product.active_ingredient || 'Chưa cập nhật hoạt chất'}
                            </div>
                        </td>
                        
                        <td class="py-4 px-5 align-top border border-gray-300 dark:border-slate-700">
                            ${pricesHtml}
                        </td>
                        
                        <td class="py-4 px-5 border border-gray-300 dark:border-slate-700">
                            <span class="text-sm font-medium ${expDate !== '--/--/----' ? 'text-slate-700 dark:text-slate-200' : 'text-slate-400 dark:text-slate-500'}">
                                ${expDate}
                            </span>
                        </td>
                        
                        <td class="py-4 px-5 text-center border border-gray-300 dark:border-slate-700">
                            <button onclick="editProduct('${product.product_code}')" class="text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors p-2" title="Chỉnh sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchType = document.getElementById('searchType');
            const suggestionsEl = document.getElementById('searchSuggestions');
            
            // Xử lý Gợi ý tìm kiếm (Autocomplete)
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                const type = searchType.value; // 'name' hoặc 'code'
                
                // Lọc trên Data Table
                const rows = document.querySelectorAll('.product-row');
                let hasVisibleRows = false;
                
                rows.forEach(row => {
                    const matchValue = row.getAttribute(`data-${type}`);
                    if (matchValue.includes(term)) {
                        row.style.display = '';
                        hasVisibleRows = true;
                    } else {
                        row.style.display = 'none';
                    }
                });

                // Xử lý Box Gợi ý
                if (term.length === 0) {
                    suggestionsEl.classList.add('hidden');
                    return;
                }

                // Lọc data mảng để làm gợi ý
                const matchedProducts = allProducts.filter(p => {
                    const val = type === 'name' ? (p.name || '') : (p.product_code || '');
                    return val.toLowerCase().includes(term);
                }).slice(0, 5); // Chỉ lấy 5 kết quả gợi ý

                if (matchedProducts.length > 0) {
                    suggestionsEl.innerHTML = matchedProducts.map(p => `
                        <li class="px-5 py-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer border-b border-gray-100 dark:border-slate-700/50 last:border-0 transition-colors"
                            onclick="selectSuggestion('${p.product_code}')">
                            <div class="flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-slate-800 dark:text-white text-sm">${p.name}</div>
                                    <div class="text-xs text-slate-500 dark:text-slate-400">${p.product_code}</div>
                                </div>
                                <i class="fa-solid fa-arrow-right text-slate-300 dark:text-slate-500"></i>
                            </div>
                        </li>
                    `).join('');
                    suggestionsEl.classList.remove('hidden');
                } else {
                    suggestionsEl.innerHTML = `<li class="px-5 py-3 text-sm text-slate-500 dark:text-slate-400 italic">Không tìm thấy kết quả.</li>`;
                    suggestionsEl.classList.remove('hidden');
                }
            });

            // Thay đổi loại tìm kiếm thì focus lại input
            searchType.addEventListener('change', () => {
                searchInput.value = '';
                searchInput.focus();
                searchInput.dispatchEvent(new Event('input'));
            });

            // Ẩn box gợi ý khi click ra ngoài
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !suggestionsEl.contains(e.target)) {
                    suggestionsEl.classList.add('hidden');
                }
            });
        }

        function selectSuggestion(code) {
            const searchInput = document.getElementById('searchInput');
            const searchType = document.getElementById('searchType');
            
            searchType.value = 'code';
            searchInput.value = code;
            
            document.getElementById('searchSuggestions').classList.add('hidden');
            
            // Trigger filter trên bảng
            searchInput.dispatchEvent(new Event('input'));
        }

        // Format tiền tệ VNĐ
        function formatCurrency(amount) {
            if (amount === null || amount === undefined || isNaN(amount)) return '0 đ';
            return Number(amount).toLocaleString('en-US') + ' đ';
        }

        // Mock data để xem trước UI (Dùng để test nếu chưa có DB)

            return [
                {
                    name: "Panadol Extra (Đỏ)", product_code: "SP0001", active_ingredient: "Paracetamol 500mg, Caffeine 65mg", packaging: "Hộp 15 vỉ x 10 viên",

                },
                {
                    name: "Vitamin C 500mg", product_code: "SP0003", active_ingredient: "Ascorbic Acid", packaging: "Chai 100 viên",

        // ================= CHECKBOX & BULK EDIT LOGIC =================
        function toggleAllCheckboxes(source) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                // Chỉ check những row đang không bị display none (đã qua filter)
                const row = cb.closest('tr');
                if(row.style.display !== 'none') {
                    cb.checked = source.checked;
                }
            });
            updateBulkEditButton();
        }

        function updateBulkEditButton() {
            const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
            const bulkBtn = document.getElementById('bulkEditBtn');
            const bulkDivider = document.getElementById('bulkEditDivider');
            const countSpan = document.getElementById('selectedCount');
            
            if (checkedCount > 0) {
                bulkBtn.classList.remove('hidden');
                bulkBtn.classList.add('flex');
                if(window.innerWidth > 768) bulkDivider.classList.remove('hidden'); // Show on md+
                countSpan.textContent = checkedCount;
            } else {
                bulkBtn.classList.add('hidden');
                bulkBtn.classList.remove('flex');
                bulkDivider.classList.add('hidden');
            }
        }
        
        function bulkEdit() {
            const checked = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            alert(`Bạn đang mở chức năng Chỉnh sửa hàng loạt cho ${checked.length} sản phẩm:\n[${checked.join(', ')}]\n\nChức năng Cập nhật nhiều sản phẩm cùng lúc sẽ sớm ra mắt!`);
        }

        // ================= MODAL EDIT LOGIC =================
        function editProduct(productCode) {
            const product = allProducts.find(p => p.product_code === productCode);
            if(!product) return;
            
            document.getElementById('editProductCode').value = product.product_code;
            document.getElementById('editName').value = product.name || '';
            document.getElementById('editIngredient').value = product.active_ingredient || '';
            document.getElementById('editPackaging').value = product.packaging || '';
            
            const expDateStr = product.expiration_date; // Expected format dd/mm/yyyy or yyyy-mm-dd
            if(expDateStr && expDateStr.includes('-')) {
                document.getElementById('editExpDate').value = expDateStr;
            } else {
                document.getElementById('editExpDate').value = '';
            }

            document.getElementById('modalTitle').textContent = `Sửa: ${product.product_code}`;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveEditProduct() {
            const code = document.getElementById('editProductCode').value;
            const newName = document.getElementById('editName').value;
            const newIng = document.getElementById('editIngredient').value;
            const newPack = document.getElementById('editPackaging').value;
            const newDate = document.getElementById('editExpDate').value;
            
            // Cập nhật mảng tĩnh (Nếu có DB thì gọi Supabase Update ở đây)
            const productIndex = allProducts.findIndex(p => p.product_code === code);
            if(productIndex !== -1) {
                allProducts[productIndex].name = newName;
                allProducts[productIndex].active_ingredient = newIng;
                allProducts[productIndex].packaging = newPack;
                allProducts[productIndex].expiration_date = newDate;
                
                renderProducts(allProducts); // Render lại bảng
                closeEditModal();
                alert(`Đã lưu thay đổi cho hàng hóa: ${code}`);
            }
        }

        // ================= IMPORT / EXPORT EXCEL (SHEETJS) =================
        function importExcel() {
            document.getElementById('importFileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    
                    console.log("Dữ liệu Import:", json);
                    alert(`Đã đọc thành công ${json.length} dòng từ file Excel.\nVui lòng mở F12 (Console) để xem cấu trúc JSON được chuyển đổi.`);
                    
                    // Reset input
                    event.target.value = '';
                } catch (err) {
                    alert('Lỗi đọc file Excel. Vui lòng kiểm tra lại định dạng!');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportExcel() {
            if(!allProducts || allProducts.length === 0) {
                alert("Không có dữ liệu để xuất!");
                return;
            }
            
            // Tạo mảng dữ liệu phẳng để SheetJS dễ parse
            const exportData = allProducts.map(p => ({
                "Mã Hàng": p.product_code,
                "Tên Thuốc": p.name,
                "Hoạt chất": p.active_ingredient || '',
                "Quy cách": p.packaging || '',
                "Giá Bán Nhỏ Nhất": p.product_units?.[0]?.retail_price || 0,
                "Hạn sử dụng": p.expiration_date || ''
            }));

            // Tạo worksheet
            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // Set độ rộng cột cho đẹp
            const wscols = [
                {wch:15}, {wch:35}, {wch:40}, {wch:25}, {wch:20}, {wch:15}
            ];
            ws['!cols'] = wscols;

            // Khởi tạo workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DanhSachHangHoa");

            // Xuất file
            XLSX.writeFile(wb, "KhaiHoanPOS_HangHoa.xlsx");
        }
    </script>
