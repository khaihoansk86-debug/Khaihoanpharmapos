<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khải Hoàn POS - Danh sách Hàng Hóa</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SheetJS (Excel Import/Export) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Cấu hình Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0056b3',
                        'primary-dark': '#004494',
                        secondary: '#f8fafc',
                    }
                }
            }
        }
    </script>

    <style>
        /* Hiệu ứng loading xoay vòng */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0056b3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 text-gray-800 dark:text-slate-200 min-h-screen transition-colors duration-300">

    <!-- Header Blue -->
    <header
        class="sticky top-0 z-50 bg-blue-700 dark:bg-slate-950 border-b border-blue-800 dark:border-slate-800 transition-colors duration-300 shadow-md">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Trái: Logo & Menu -->
            <div class="flex items-center gap-12 h-full">
                <!-- Logo -->
                <div class="flex items-center gap-2 text-white shrink-0">
                    <i class="fa-solid fa-notes-medical text-2xl"></i>
                    <h1
                        class="text-lg font-bold tracking-tight hidden lg:block text-white transition-colors">
                        Khải Hoàn<span class="text-blue-200 font-normal ml-1">POS</span></h1>
                </div>

                <!-- Menu Navigation (7 trường) -->
                <nav class="hidden md:flex items-center gap-8 h-full overflow-x-auto hide-scrollbar whitespace-nowrap">
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Tổng
                        quan</a>
                    <a
                        class="text-white dark:text-blue-500 font-bold text-sm border-b-4 border-white dark:border-blue-500 h-full flex items-center cursor-pointer px-1">Hàng
                        hóa</a>
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Đơn
                        hàng</a>
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Nhân
                        viên</a>
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Khách
                        hàng</a>
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Sổ
                        quỹ</a>
                    <a
                        class="text-blue-100 dark:text-slate-400 font-medium text-sm hover:text-white dark:hover:text-white transition-colors duration-200 border-b-2 border-transparent h-full flex items-center cursor-pointer px-1">Báo
                        cáo</a>
                </nav>
            </div>

            <!-- Phải: Search, Dark Mode & User -->
            <div class="flex items-center justify-end gap-4 shrink-0">

                <!-- Nút Dark Mode -->
                <button onclick="toggleDarkMode()"
                    class="bg-blue-800/50 dark:bg-slate-800 text-blue-100 dark:text-slate-400 w-9 h-9 rounded-full flex items-center justify-center hover:bg-blue-800 dark:hover:bg-slate-700 transition-colors border border-blue-600 dark:border-slate-700">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>

                <!-- Cụm User -->
                <div
                    class="flex items-center gap-3 bg-blue-800/50 dark:bg-slate-800 px-3 py-1.5 rounded-full transition-colors border border-blue-600 dark:border-slate-700">
                    <div class="flex items-center gap-2 cursor-pointer group">
                        <div
                            class="w-6 h-6 bg-white dark:bg-blue-900/50 text-blue-700 dark:text-blue-400 rounded-full flex items-center justify-center font-bold text-xs">
                            A
                        </div>
                        <span
                            class="text-sm font-semibold text-white dark:text-slate-300 group-hover:text-blue-100 dark:group-hover:text-white transition-colors hidden lg:block">Admin</span>
                    </div>
                    <div class="h-3 w-px bg-blue-600 dark:bg-slate-600"></div>
                    <button
                        class="text-blue-200 dark:text-slate-400 hover:text-white dark:hover:text-red-400 transition-colors text-sm font-medium"
                        title="Đăng xuất">
                        Đăng xuất
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full px-4 md:px-6 lg:px-8 py-8 flex flex-col gap-6">
        <!-- Title Box & Actions -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl shadow-black/30 dark:shadow-none p-5 border-2 border-slate-300 dark:border-slate-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative z-30">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white border-l-4 border-blue-600 pl-3">Danh sách Hàng hóa</h2>
            
            <div class="flex flex-wrap items-center gap-3">
                <button id="bulkEditBtn" onclick="bulkEdit()" class="hidden bg-orange-500 hover:bg-orange-600 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm shadow-orange-500/20 hover:shadow-orange-500/40 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Sửa hàng loạt (<span id="selectedCount">0</span>)
                </button>
                <div id="bulkEditDivider" class="hidden h-6 w-px bg-gray-200 dark:bg-slate-700 mx-1"></div>
                
                <button onclick="importExcel()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center gap-2 shadow-sm border border-transparent dark:border-slate-700/50">
                    <i class="fa-solid fa-file-import text-blue-500"></i> Import
                </button>
                <button onclick="exportExcel()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center gap-2 shadow-sm border border-transparent dark:border-slate-700/50">
                    <i class="fa-solid fa-file-export text-green-500"></i> Export
                </button>
                <div class="h-6 w-px bg-gray-200 dark:bg-slate-700 hidden md:block mx-1"></div>
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-sm transition-all flex items-center gap-2 shadow-blue-500/20">
                    <i class="fa-solid fa-plus"></i> Thêm hàng hóa
                </button>
            </div>
        </div>

        <!-- Main Content Area (2 Columns) -->
        <div class="flex flex-col lg:flex-row gap-6 relative items-start">
            
            <!-- Cột Trái: Side Filter (Nằm dọc) -->
            <aside id="inlineFilterPanel" class="hidden w-full lg:w-72 flex-shrink-0 bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-800 p-5 transition-all duration-300">
                <div class="flex items-center justify-between mb-5 pb-4 border-b border-gray-100 dark:border-slate-800">
                    <h3 class="font-bold text-gray-800 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-filter text-blue-600"></i> Bộ Lọc Dữ Liệu
                    </h3>
                    <button onclick="toggleFilter()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="flex flex-col gap-6">
                    <!-- Nhóm hàng hóa -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Nhóm hàng hóa</label>
                        <select class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                            <option>Tất cả</option>
                            <option>Kháng sinh</option>
                            <option>Vitamin & Khoáng chất</option>
                            <option>Thực phẩm chức năng</option>
                        </select>
                    </div>
                    
                    <!-- Trạng thái -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Trạng thái</label>
                        <div class="flex flex-col gap-3 mt-1">
                            <label class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-400 cursor-pointer">
                                <input type="checkbox" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 transition-colors" checked>
                                Đang kinh doanh
                            </label>
                            <label class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-400 cursor-pointer">
                                <input type="checkbox" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 transition-colors">
                                Ngừng kinh doanh
                            </label>
                        </div>
                    </div>
                    
                    <!-- Đơn vị tính -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Đơn vị tính cơ bản</label>
                        <select class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-colors">
                            <option>Tất cả</option>
                            <option>Viên</option>
                            <option>Vỉ</option>
                            <option>Hộp</option>
                            <option>Chai</option>
                        </select>
                    </div>

                    <!-- Footer (Buttons) -->
                    <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-gray-100 dark:border-slate-800">
                        <button onclick="toggleFilter()" class="py-2.5 rounded-lg font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 border border-transparent hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Đóng</button>
                        <button onclick="toggleFilter()" class="py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-sm shadow-blue-500/30">Áp dụng</button>
                    </div>
                </div>
            </aside>

            <!-- Cột Phải: Tìm kiếm & Bảng dữ liệu -->
            <div class="flex-1 min-w-0 flex flex-col gap-6 w-full">
                <!-- Thanh Tìm Kiếm -->
                <div class="flex items-center gap-3 w-full relative z-30">
                    <!-- Nút Toggle Filter -->
                    <button onclick="toggleFilter()" class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 px-4 py-3.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm flex items-center justify-center shrink-0" title="Bộ lọc nâng cao">
                        <i class="fa-solid fa-filter text-xl"></i>
                    </button>
                    
                    <!-- Khung Tìm Kiếm Mở Rộng -->
                    <div class="relative flex-1 shadow-sm flex bg-white dark:bg-slate-900 rounded-xl border border-gray-200 dark:border-slate-800">
                        <select id="searchType" class="bg-transparent border-none text-sm font-medium text-slate-600 dark:text-slate-300 py-3.5 pl-4 pr-8 focus:ring-0 outline-none cursor-pointer border-r border-gray-200 dark:border-slate-700">
                            <option value="name">Tìm theo Tên</option>
                            <option value="code">Tìm theo Mã</option>
                        </select>
                        
                        <div class="relative flex-1">
                            <input type="text" id="searchInput" placeholder="Gõ từ khóa để tìm kiếm..." autocomplete="off"
                                class="w-full pl-10 pr-4 py-3.5 bg-transparent border-none text-gray-800 dark:text-slate-200 text-base focus:ring-0 outline-none placeholder-slate-400 font-medium">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        </div>
                        
                        <ul id="searchSuggestions" class="absolute top-full left-0 right-0 mt-2 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl shadow-xl z-40 max-h-80 overflow-y-auto hidden">
                        </ul>
                    </div>
                </div>

                <!-- Trạng thái Loading -->
                <div id="loading" class="flex flex-col justify-center items-center py-20 bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800">
                    <div class="loader mb-4"></div>
                    <p class="text-gray-500 font-medium">Đang tải dữ liệu từ Supabase...</p>
                </div>

                <!-- Bảng Dữ liệu -->
                <div id="product-table-wrapper" class="hidden overflow-x-auto bg-white dark:bg-slate-900 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:shadow-none border border-gray-200 dark:border-slate-800 relative z-20 p-1">
                    <table class="w-full text-left border-collapse whitespace-nowrap border border-gray-300 dark:border-slate-700">
                        <thead>
                            <tr class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-sm">
                                <th class="py-4 px-3 font-bold border border-gray-300 dark:border-slate-700 w-12 text-center">
                                    <input type="checkbox" id="selectAllCheckbox" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer" onchange="toggleAllCheckboxes(this)">
                                </th>
                                <th class="py-4 px-5 font-bold border border-gray-300 dark:border-slate-700">Mã Hàng</th>
                                <th class="py-4 px-5 font-bold border border-gray-300 dark:border-slate-700">Tên Thuốc / Hoạt chất</th>
                                <th class="py-4 px-5 font-bold border border-gray-300 dark:border-slate-700">Giá Bán</th>
                                <th class="py-4 px-5 font-bold border border-gray-300 dark:border-slate-700">TG Hết Hạn</th>
                                <th class="py-4 px-5 font-bold text-center w-24 border border-gray-300 dark:border-slate-700">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="product-container" class="divide-y divide-gray-100 dark:divide-slate-800/80">
                            <!-- Sản phẩm (Rows) sẽ được render ở đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Chỉnh sửa Hàng hóa -->
    <div id="editModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-lg border border-gray-200 dark:border-slate-700 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between p-5 border-b border-gray-100 dark:border-slate-800">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-600"></i> <span id="modalTitle">Chỉnh sửa Hàng hóa</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-5 flex-1 overflow-y-auto">
                <form id="editForm" class="flex flex-col gap-4">
                    <input type="hidden" id="editProductCode">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Tên thuốc / Hàng hóa</label>
                        <input type="text" id="editName" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-800 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Hoạt chất chính</label>
                        <input type="text" id="editIngredient" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-800 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Quy cách đóng gói</label>
                            <input type="text" id="editPackaging" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-800 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">Thời gian hết hạn</label>
                            <input type="date" id="editExpDate" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-800 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-5 border-t border-gray-100 dark:border-slate-800 flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-5 py-2.5 rounded-lg font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Hủy bỏ</button>
                <button onclick="saveEditProduct()" class="px-5 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 shadow-sm shadow-blue-500/30 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                </button>
            </div>
        </div>
    </div>
    
    <!-- Input ẩn để nhận file Excel khi bấm nút Import -->
    <input type="file" id="importFileInput" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleFileImport(event)">

    <!-- Javascript Logic -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
